[project]
name = "ecommerce-support-agent"
version = "0.1.0"
description = "E-commerce support workflow foundation (explicit mock mode)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.2", "alembic>=1.14,<2", "psycopg[binary,pool]>=3.2,<4",
  "celery[redis]>=5.5,<6", "redis>=5,<9", "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires dedicated PostgreSQL and Redis"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
